name: Real-image traffic sign detector pilot

# CPU detector training took about 80 minutes and produced no true positives
# in the first baseline. Keep expensive training manual until the pipeline is
# corrected and reviewed; normal code pushes run the lightweight unit tests.
on:
  workflow_dispatch:

concurrency:
  group: schild-pilot-detector-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detector-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "Pillow>=10.0"
      - name: Download the versioned Zenodo release
        run: |
          curl --fail --location --retry 3 \
            "https://zenodo.org/records/22052437/files/object-centric-low-data-datasets-v0.2.0.zip?download=1" \
            --output /tmp/traffic-signs-release.zip
          echo "e1e162d114cfe14b209ab7614511524b0c558db72935d3e32c096f87150aff86  /tmp/traffic-signs-release.zip" | sha256sum --check
      - name: Extract only TrafficSigns-Raw and its license notice
        run: |
          python - <<'PY'
          import zipfile
          archive = "/tmp/traffic-signs-release.zip"
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              raw_readmes = [n for n in names if n.endswith("/traffic_signs_raw/README.md")]
              license_files = [n for n in names if n.endswith("/LICENSES/traffic_signs_license.txt")]
              if len(raw_readmes) != 1 or len(license_files) != 1:
                  raise SystemExit("TrafficSigns-Raw-README oder eindeutige Lizenzdatei fehlt.")
              raw_prefix = raw_readmes[0].rsplit("README.md", 1)[0]
              license_path = license_files[0]
              selected = [n for n in names if n.startswith(raw_prefix) or n == license_path]
              for name in selected:
                  if name.startswith("/") or ".." in name.split("/"):
                      raise SystemExit(f"Unsicherer Archivpfad: {name}")
              z.extractall("/tmp/traffic-signs-extracted", selected)
              with open("/tmp/traffic-signs-extracted/traffic_signs_license_path.txt", "w") as f:
                  f.write(license_path)
              print(f"Extrahierter Datensatzpfad: {raw_prefix}")
              print(f"Lizenzdatei: {license_path}")
          PY
      - name: Verify license and convert original splits to COCO
        run: |
          LICENSE_PATH="$(cat /tmp/traffic-signs-extracted/traffic_signs_license_path.txt)"
          SOURCE_PATH="$(python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/traffic-signs-release.zip") as z:
              print(next(n.rsplit("README.md",1)[0] for n in z.namelist() if n.endswith("/traffic_signs_raw/README.md")).rstrip("/"))
          PY
          )"
          python -m training.prepare_traffic_signs_raw \
            --source "/tmp/traffic-signs-extracted/$SOURCE_PATH" \
            --license-file "/tmp/traffic-signs-extracted/$LICENSE_PATH" \
            --output data/detection
          mkdir -p artifacts
          cp "/tmp/traffic-signs-extracted/$LICENSE_PATH" artifacts/traffic_signs_raw_license.txt
      - name: Audit converted dataset
        run: python -m training.audit_detection_dataset --data data/detection --output artifacts/detection_audit.json
      - name: Train compact detector from random initialization and evaluate
        run: python -m training.train_detector --data data/detection --epochs 3 --batch-size 2 --workers 2
      - name: Upload compact evaluation report (not model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schild-pilot-real-image-detector-report
          path: |
            artifacts/sign_detector/*.json
            artifacts/detection_audit.json
            artifacts/traffic_signs_raw_intake.json
            artifacts/traffic_signs_raw_license.txt
          if-no-files-found: warn
          retention-days: 7
