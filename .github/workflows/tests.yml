name: Project tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image validation dependency
        run: python -m pip install "Pillow==11.3.0"
      - name: Compile Python modules
        run: python -m compileall -q core training tests
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check web/photo-input.js && node --check web/app.js
      - name: Run browser photo-input tests
        run: node --test tests/test_photo_input.js
