name: Synthetic German sign classifier training

on:
  workflow_dispatch:
    inputs:
      confirm_training:
        description: "Explizit bestätigen: 94.950 synthetische Bilder laden und ResNet18 auf CPU trainieren."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  train-pilot:
    if: ${{ inputs.confirm_training == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3.0" "Pillow>=10.0" "numpy>=1.26" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Prepare expanded balanced German dataset
        run: python -m training.prepare_synset_dataset --per-class-train 350 --per-class-val 50 --per-class-test 50
      - name: Audit prepared dataset
        run: python -m training.audit_dataset --data data/signs
      - name: Fine-tune ResNet18 on CPU
        run: python -m training.train_classifier --data data/signs --epochs 2 --batch-size 32 --image-size 160 --workers 2 --patience 2
      - name: Calibrate abstention thresholds on validation split only
        run: python -m training.calibrate_thresholds --data data/signs/val --min-coverage 0.80
      - name: Evaluate once on held-out derived test split
        run: python -m training.evaluate_classifier --data data/signs/test
      - name: Upload metrics and source manifest only
        uses: actions/upload-artifact@v4
        with:
          name: schild-pilot-expanded-german-metrics
          path: |
            artifacts/evaluation/
            data/signs/source_manifest.json
          if-no-files-found: error
          retention-days: 7
