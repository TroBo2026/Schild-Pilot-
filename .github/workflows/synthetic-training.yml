name: Synthetic sign classifier pilot
on:
  push:
    branches: [main]
    paths:
      - "training/prepare_synset_dataset.py"
      - "training/train_classifier.py"
      - "training/evaluate_classifier.py"
      - ".github/workflows/synthetic-training.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3.0" "Pillow>=10.0" "numpy>=1.26" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Prepare larger balanced licensed pilot subset
        run: python -m training.prepare_synset_dataset --per-class-train 80 --per-class-val 10 --per-class-test 10
      - name: Audit prepared dataset
        run: python -m training.audit_dataset --data data/signs
      - name: Fine-tune ResNet18 on CPU
        run: python -m training.train_classifier --data data/signs --epochs 8 --batch-size 32 --image-size 160 --workers 2 --patience 3
      - name: Evaluate on held-out derived test split
        run: python -m training.evaluate_classifier --data data/signs/test
      - name: Upload model metrics and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: schild-pilot-improved-synthetic-classifier
          path: |
            artifacts/sign_classifier/
            artifacts/evaluation/
            data/signs/source_manifest.json
          if-no-files-found: error
          retention-days: 7
